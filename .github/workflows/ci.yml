name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Unset SITE_MODE must build the splash. A second build checks live mode.
      - name: Build splash mode
        run: npm run build

      - name: Build live mode
        run: npm run clear && SITE_MODE=live npm run build
